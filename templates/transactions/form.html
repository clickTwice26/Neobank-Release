{% extends "base.html" %}

{% block title %}{% if transaction %}Edit{% else %}Add{% endif %} Transaction - NeoBank{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-3">
        <a href="{{ url_for('transactions.list') }}" 
           class="w-10 h-10 rounded-lg bg-white flex items-center justify-center hover:bg-gray-100 transition shadow-sm">
            <i class='bx bx-arrow-back text-xl text-text-dark'></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-text-dark">
                {% if transaction %}Edit Transaction{% else %}Add Transaction{% endif %}
            </h1>
            <p class="text-text-gray text-sm">Fill in the details below</p>
        </div>
    </div>
    
    <!-- Form -->
    <div class="bg-white rounded-xl p-6 shadow-sm">
        <form method="POST" class="space-y-6">
            <!-- Transaction Type -->
            <div class="floating-label-input">
                <select name="transaction_type" id="transaction_type" required 
                        onchange="updateCategories()"
                        class="text-text-dark">
                    <option value="">Select Type</option>
                    <option value="income" {% if transaction and transaction.transaction_type == 'income' %}selected{% endif %}>Income</option>
                    <option value="expense" {% if transaction and transaction.transaction_type == 'expense' %}selected{% endif %}>Expense</option>
                </select>
                <label for="transaction_type">Transaction Type</label>
            </div>
            
            <!-- Amount -->
            <div class="floating-label-input">
                <input type="number" step="0.01" name="amount" id="amount" 
                       placeholder=" " required
                       value="{% if transaction %}{{ transaction.amount }}{% endif %}"
                       class="text-text-dark">
                <label for="amount">Amount ($)</label>
            </div>
            
            <!-- Category -->
            <div class="floating-label-input">
                <select name="category" id="category" required class="text-text-dark">
                    <option value="">Select Category</option>
                </select>
                <label for="category">Category</label>
            </div>
            
            <!-- Description -->
            <div class="floating-label-input">
                <input type="text" name="description" id="description" 
                       placeholder=" " required
                       value="{% if transaction %}{{ transaction.description }}{% endif %}"
                       class="text-text-dark">
                <label for="description">Description</label>
            </div>
            
            <!-- Date -->
            <div class="floating-label-input">
                <input type="date" name="date" id="date" 
                       placeholder=" " required
                       value="{% if transaction %}{{ transaction.date.strftime('%Y-%m-%d') }}{% else %}{{ now().strftime('%Y-%m-%d') }}{% endif %}"
                       class="text-text-dark">
                <label for="date">Date</label>
            </div>
            
            <!-- Submit Buttons -->
            <div class="flex gap-3 pt-4">
                <button type="submit" 
                        class="flex-1 bg-accent text-white py-3 rounded-lg font-semibold hover:bg-green-600 transition shadow-sm">
                    <i class='bx bx-check mr-2'></i>
                    {% if transaction %}Update Transaction{% else %}Add Transaction{% endif %}
                </button>
                <a href="{{ url_for('transactions.list') }}" 
                   class="px-6 bg-gray-200 text-text-dark py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    const categories = {{ categories|tojson }};
    
    function updateCategories() {
        const typeSelect = document.getElementById('transaction_type');
        const categorySelect = document.getElementById('category');
        const selectedType = typeSelect.value;
        const currentCategory = "{% if transaction %}{{ transaction.category }}{% endif %}";
        
        // Clear current options
        categorySelect.innerHTML = '<option value="">Select Category</option>';
        
        if (selectedType && categories[selectedType]) {
            categories[selectedType].forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                if (category === currentCategory) {
                    option.selected = true;
                }
                categorySelect.appendChild(option);
            });
        }
    }
    
    // Initialize categories on page load
    document.addEventListener('DOMContentLoaded', function() {
        updateCategories();
    });
</script>
{% endblock %}
